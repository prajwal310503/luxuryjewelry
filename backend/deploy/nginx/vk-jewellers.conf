# VK Jewellers — Nginx production config
# Static file cache + gzip + SPA + API reverse proxy
#
# Install (Ubuntu example):
#   sudo cp deploy/nginx/vk-jewellers.conf /etc/nginx/sites-available/vk-jewellers
#   sudo ln -sf /etc/nginx/sites-available/vk-jewellers /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paths to adjust:
#   root          → frontend build output (dist/client or dist)
#   proxy_pass    → Node API (default localhost:8000)
#   server_name   → your domain

upstream vk_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Optional: redirect HTTP → HTTPS (enable when SSL is ready)
# server {
#     listen 80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Frontend build (Vite: npm run build → dist/client)
    root /var/www/vk-jewellers/frontend/dist/client;
    index index.html;

    # ── Security / performance headers ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # Open file cache (nginx OS cache for static files)
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ── Vite hashed assets — long cache (filenames change on every build) ────
    # e.g. /assets/index-a1b2c3d4.js
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Static media extensions (public folder, favicons, etc.) ──────────────
    location ~* \.(?:js|css|mjs|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Backend uploads (if served from this host; Cloudinary usually used) ──
    location /uploads/ {
        alias /var/www/vk-jewellers/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ── API — no browser cache for dynamic JSON ──────────────────────────────
    location /api/ {
        proxy_pass http://vk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API responses should not be cached by browsers/CDN by default
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 25m;
    }

    # ── SPA entry — NEVER long-cache index.html ─────────────────────────────
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # ── Client-side routes (React Router) ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # HTML navigations: short/no cache so deploys go live immediately
        add_header Cache-Control "no-cache" always;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
